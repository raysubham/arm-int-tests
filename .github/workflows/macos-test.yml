name: MacOSLatest

on:
  workflow_dispatch:

        
jobs:
  enum:
    runs-on: macos-latest
    steps:

          
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: h0x0er/harden-runner@cb6fbdacfe38ac99d337e34c641437afc019fde0 # exp/mac-agent
        with:
          egress-policy: audit

      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # main

      - run: curl https://www.google.com
      - run: dig bing.com
      - run: dig youtube.com
      - run: curl http://yahoo.com
      # - run: dig +tcp apple.com # tcp is not available

      - name: echo overwrite
        run: echo "overwrite" >> source.js

      - name: copy overwrite
        run: | 
          echo "overwrite" > source.js2
          cp source.js2 source.js

      - name: mv overwrite
        run: | 
          echo "overwrite" > source.js3
          mv source.js3 source.js

